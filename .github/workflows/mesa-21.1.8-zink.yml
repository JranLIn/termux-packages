name: Mesa 21.1.8 Zink aarch64
on:
  workflow_dispatch:
  push:
    branches: [mesa-21.1.8-zink]
    paths:
      - 'packages/mesa-zink-legacy/**'
      - '.github/workflows/mesa-21.1.8-zink.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Check Docker
        run: docker version
      - name: Build Termux aarch64 package in official Docker image
        run: |
          ./scripts/run-docker.sh ./build-package.sh -I -C -a aarch64 mesa-zink-legacy
      - name: Collect Debian packages
        if: always()
        run: |
          mkdir -p debs
          if [ -d output ]; then
            find output -type f -name '*_aarch64.deb' -print -exec cp -v {} debs/ \;
          fi
          find debs -maxdepth 1 -type f -name '*.deb' -print -exec sha256sum {} \;
      - name: Upload aarch64 Debian packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesa-21.1.8-zink-aarch64
          path: debs/*.deb
          if-no-files-found: warn
